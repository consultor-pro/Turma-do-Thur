<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turma do Thur</title>
<meta name="theme-color" content="#FFD60A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turma do Thur">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: alegre, barulhento de cor, feito para dedinhos de 2 a 6 anos
   IDEA: um estojo de lápis de cor aberto sobre a mesa
   PICTURE: o Thur grande na entrada; a folha branca é o centro de tudo
   COLOUR and TYPE: amarelo-sol dominante, lilás, azul e verde de apoio, Baloo 2
   LAYOUT: tela cheia, botões gigantes, paleta embaixo, quase nada de texto */
:root{color-scheme:light;--sol:#FFD60A;--lilas:#9B5DE5;--ceu:#4FB3F0;--verde:#4CC764;--ink:#2E2440;--papel:#FFF7EC;--sombra:#E9DCC6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--papel);color:var(--ink);font:600 17px/1.4 'Baloo 2',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:4px solid var(--ceu);outline-offset:3px}
.view{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.view.on{display:flex}
#home{background:var(--sol);overflow:auto}
.hero{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,56px);padding:20px;flex-wrap:wrap}
.hero img{height:min(40vh,400px);width:auto;filter:drop-shadow(0 10px 0 rgba(0,0,0,.12))}
.menu{display:flex;flex-direction:column;gap:14px;width:min(460px,100%)}
.menu h1{margin:0;font-weight:800;font-size:clamp(36px,7vw,60px);line-height:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:28px;font-size:clamp(22px,4.6vw,30px);font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .1s}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.big svg{width:60px;height:60px}
.b1{background:var(--lilas);color:#fff}.b2{background:#fff}.b3{background:var(--ceu);color:#fff}.b4{background:var(--verde);color:#fff}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.bar h2{margin:0;font-weight:800;font-size:26px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:#fff;box-shadow:0 5px 0 var(--sombra);flex:none}
.ico:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sombra)}
.ico svg{width:30px;height:30px}
.ico.on{background:var(--ink);color:#fff;box-shadow:0 5px 0 #000}
.paper{flex:1;margin:0 14px;background:#fff;border-radius:28px;box-shadow:0 6px 0 var(--sombra);position:relative;overflow:hidden}
canvas.full{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;touch-action:none}
#page svg{width:100%;height:100%;touch-action:none}
.tools{display:flex;flex-direction:column;gap:8px;padding:10px 14px 14px}
.pal{display:flex;gap:12px;overflow-x:auto;padding:8px 8px 10px;scrollbar-width:none}
.pal::-webkit-scrollbar{display:none}
.sw{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 3px #fff;transition:transform .12s}
.sw.on{transform:scale(1.18);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 4px var(--ink)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dot{display:block;border-radius:50%;background:currentColor}
.sep{width:2px;height:40px;background:var(--sombra);border-radius:2px}
.txt{width:auto;min-width:84px;padding:0 14px;font-size:24px;font-weight:800;white-space:nowrap}
#gal{flex:1;overflow:auto;padding:6px 14px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;align-content:start}
.card{background:#fff;border-radius:24px;padding:10px;box-shadow:0 6px 0 var(--sombra);display:flex;flex-direction:column;align-items:center;font-size:19px;font-weight:800}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sombra)}
.card svg{width:100%;aspect-ratio:1;height:auto}
.cap{display:flex;align-items:center;justify-content:center;gap:12px;padding:0 14px 8px;font-size:26px;font-weight:800}
.cap .pic{font-size:44px;line-height:1}
.stars{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
#wordBox{flex:1;margin:0 14px 14px;background:#fff;border-radius:28px;box-shadow:0 6px 0 var(--sombra);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:16px;overflow:hidden}
#wPic{font-size:clamp(90px,20vh,150px);line-height:1}
.slots,.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot,.tile{width:clamp(50px,14vw,76px);height:clamp(60px,16vw,86px);border-radius:18px;display:grid;place-items:center;font-size:clamp(32px,9vw,48px);font-weight:800;line-height:1}
.slot{background:#F4EFE6;border:3px dashed #D9CCB6;color:#CDBFA8}
.slot.full{border-style:solid;background:#fff;color:var(--ink);border-color:var(--ceu)}
.slot.ok{border-color:var(--verde);background:#EAF9EC}
.tile{background:var(--sol);box-shadow:0 6px 0 #D8B100;color:var(--ink)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #D8B100}
.tile.used{visibility:hidden}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#party{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
#party i{position:absolute;top:-30px;width:14px;height:20px;border-radius:4px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.veil{position:fixed;inset:0;background:rgba(46,36,64,.5);display:none;align-items:center;justify-content:center;z-index:9}
.veil.on{display:flex}
.dlg{background:#fff;border-radius:32px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:18px;width:min(340px,90vw);text-align:center;font-size:24px;font-weight:800}
.dlg .row button{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.dlg svg{width:48px;height:48px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:18px;transition:.25s;z-index:10;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#print{display:none}
@media print{body{overflow:visible}.view,.veil,#toast,#party{display:none!important}#print{display:block}#print svg{width:100%;height:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){.bar h2{font-size:21px}.ico{width:50px;height:50px}.ico svg{width:26px;height:26px}.sw{width:46px;height:46px}.hero img{height:30vh}.txt{font-size:20px;padding:0 12px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 32 32"><path d="M20 6L10 16l10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 32 32"><path d="M10 12h11a7 7 0 0 1 0 14h-6M10 12l5-5M10 12l5 5" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 32 32"><path d="M7 9h18M13 9V6h6v3M9 9l1.5 17h11L23 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-save" viewBox="0 0 32 32"><path d="M16 5v15M10 14l6 6 6-6M7 26h18" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-print" viewBox="0 0 32 32"><path d="M9 12V5h14v7M9 22H6V12h20v10h-3M10 18h12v9H10z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="i-sound" viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="currentColor"/><path d="M21 11a6 6 0 0 1 0 10M24 7a11 11 0 0 1 0 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 32 32"><path d="M12 6l10 10-10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-prev" viewBox="0 0 32 32"><path d="M20 6L10 16l10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-tap" viewBox="0 0 32 32"><path d="M8 14l9-9 9 9-9 9z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M8 14h18l-9 9z" fill="currentColor"/><path d="M27 20c0 3-2 5-2 6a2 2 0 0 0 4 0c0-1-2-3-2-6z" fill="currentColor"/></symbol>
  <symbol id="i-crayon" viewBox="0 0 32 32"><path d="M6 26l3-9L22 4l6 6-13 13z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M6 26l3-9 6 6z" fill="currentColor"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 32 32"><path d="M16 4a8 8 0 0 0-5 14v4h10v-4a8 8 0 0 0-5-14zM12 26h8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<section id="home" class="view on" aria-label="Início">
  <div class="hero">
    <img src="thur.png" alt="Thur, sorrindo, de camisa xadrez">
    <div class="menu">
      <h1>Turma do Thur</h1>
      <div class="grid">
        <button class="big b1" data-go="desenhar"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 50l4-14L42 12a6 6 0 0 1 9 9L27 45z" fill="#FFD60A" stroke="#2E2440" stroke-width="4" stroke-linejoin="round"/><path d="M14 50l4-14 9 9z" fill="#F4C9A0" stroke="#2E2440" stroke-width="4" stroke-linejoin="round"/></svg>Desenhar</button>
        <button class="big b2" data-go="colorir"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="24" r="12" fill="#FF4D4D"/><circle cx="42" cy="24" r="12" fill="#4FB3F0"/><circle cx="32" cy="42" r="12" fill="#4CC764"/></svg>Colorir</button>
        <button class="big b3" data-go="letras"><svg viewBox="0 0 64 64" aria-hidden="true"><text x="32" y="50" text-anchor="middle" font-size="46" font-weight="800" font-family="Baloo 2, sans-serif" fill="#fff" stroke="#2E2440" stroke-width="3" paint-order="stroke">Aa</text></svg>Letras</button>
        <button class="big b4" data-go="palavras"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="18" width="17" height="24" rx="5" fill="#FFD60A" stroke="#2E2440" stroke-width="3"/><rect x="24" y="18" width="17" height="24" rx="5" fill="#fff" stroke="#2E2440" stroke-width="3"/><rect x="44" y="18" width="17" height="24" rx="5" fill="#FF85C0" stroke="#2E2440" stroke-width="3"/></svg>Palavras</button>
      </div>
    </div>
  </div>
</section>

<section id="desenhar" class="view" aria-label="Desenhar">
  <div class="bar">
    <button class="ico" data-go="home" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
    <h2>Desenhar</h2>
    <button class="ico" id="undo" aria-label="Desfazer"><svg><use href="#i-undo"/></svg></button>
    <button class="ico" id="save" aria-label="Salvar imagem"><svg><use href="#i-save"/></svg></button>
    <button class="ico" id="clear" aria-label="Apagar tudo"><svg><use href="#i-trash"/></svg></button>
  </div>
  <div class="paper"><canvas id="cv" class="full" aria-label="Folha para desenhar"></canvas></div>
  <div class="tools">
    <div class="pal" id="palD" role="group" aria-label="Cores"></div>
    <div class="row">
      <button class="ico size" data-size="0.012" aria-label="Pincel fino"><span class="dot" style="width:10px;height:10px"></span></button>
      <button class="ico size on" data-size="0.025" aria-label="Pincel médio"><span class="dot" style="width:18px;height:18px"></span></button>
      <button class="ico size" data-size="0.05" aria-label="Pincel grosso"><span class="dot" style="width:28px;height:28px"></span></button>
      <button class="ico" id="eraser" aria-label="Borracha"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 20l10-12 10 8-8 10h-7z" fill="#FF85C0" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M11 26h15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</section>

<section id="colorir" class="view" aria-label="Escolher desenho para colorir">
  <div class="bar">
    <button class="ico" data-go="home" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
    <h2>Escolha um desenho</h2>
    <span style="width:58px"></span>
  </div>
  <div id="gal"></div>
</section>

<section id="pintar" class="view" aria-label="Colorir">
  <div class="bar">
    <button class="ico" data-go="colorir" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
    <h2 id="pgName">Colorir</h2>
    <button class="ico" id="pUndo" aria-label="Desfazer"><svg><use href="#i-undo"/></svg></button>
    <button class="ico" id="pPrint" aria-label="Imprimir folha para colorir"><svg><use href="#i-print"/></svg></button>
    <button class="ico" id="pClear" aria-label="Recomeçar"><svg><use href="#i-trash"/></svg></button>
  </div>
  <div class="paper"><div id="page"></div></div>
  <div class="tools">
    <div class="pal" id="palC" role="group" aria-label="Cores"></div>
    <div class="row">
      <button class="ico mode on" data-mode="tap" aria-label="Tocar para pintar a área inteira"><svg><use href="#i-tap"/></svg></button>
      <button class="ico mode" data-mode="risco" aria-label="Rabiscar com o dedo dentro do desenho"><svg><use href="#i-crayon"/></svg></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="ico psize on" data-w="10" aria-label="Rabisco fino"><span class="dot" style="width:12px;height:12px"></span></button>
      <button class="ico psize" data-w="22" aria-label="Rabisco grosso"><span class="dot" style="width:24px;height:24px"></span></button>
    </div>
  </div>
</section>

<section id="letras" class="view" aria-label="Escrever letras">
  <div class="bar">
    <button class="ico" data-go="home" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
    <button class="ico" id="lPrev" aria-label="Letra anterior"><svg><use href="#i-prev"/></svg></button>
    <h2 id="lTitle">Letras</h2>
    <button class="ico" id="lNext" aria-label="Próxima letra"><svg><use href="#i-next"/></svg></button>
    <button class="ico" id="lClear" aria-label="Escrever de novo"><svg><use href="#i-trash"/></svg></button>
  </div>
  <div class="cap"><span class="pic" id="lPic" aria-hidden="true"></span><span id="lWord"></span><button class="ico" id="lSay" aria-label="Ouvir"><svg><use href="#i-sound"/></svg></button></div>
  <div class="paper"><canvas id="tcv" class="full" aria-label="Cubra a letra com o dedo"></canvas><div class="stars" id="lStars"></div></div>
  <div class="tools">
    <div class="pal" id="palL" role="group" aria-label="Cores"></div>
    <div class="row">
      <button class="ico lset txt on" data-set="up" aria-label="Letras maiúsculas">ABC</button>
      <button class="ico lset txt" data-set="low" aria-label="Letras minúsculas">abc</button>
      <button class="ico lset txt" data-set="num" aria-label="Números">123</button>
    </div>
  </div>
</section>

<section id="palavras" class="view" aria-label="Formar palavras">
  <div class="bar">
    <button class="ico" data-go="home" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
    <h2>Palavras</h2>
    <button class="ico on" id="wHint" aria-label="Mostrar dica das letras"><svg><use href="#i-bulb"/></svg></button>
    <button class="ico" id="wSay" aria-label="Ouvir a palavra"><svg><use href="#i-sound"/></svg></button>
    <button class="ico" id="wNext" aria-label="Próxima palavra"><svg><use href="#i-next"/></svg></button>
  </div>
  <div id="wordBox">
    <div id="wPic" aria-hidden="true"></div>
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
  </div>
</section>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="dlg">
    <span id="dlgT">Apagar tudo?</span>
    <div class="row">
      <button id="no" style="background:#eee" aria-label="Não"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 14l20 20M34 14L14 34" stroke="#2E2440" stroke-width="6" stroke-linecap="round"/></svg></button>
      <button id="yes" style="background:#4CC764" aria-label="Sim"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M11 25l9 9 17-19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>
<div id="party"></div>
<div id="toast" role="status"></div>
<div id="print"></div>

<script>
{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const COLORS=['#FF4D4D','#FF9F1C','#FFD60A','#4CC764','#8FE0A0','#4FB3F0','#3D5AFE','#9B5DE5','#FF85C0','#F4C9A0','#8D5B3E','#2B2B2B','#FFFFFF'];
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
let ac;
function pop(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f||520,ac.currentTime);o.frequency.exponentialRampToValueAtTime((f||520)*1.8,ac.currentTime+.12);g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(e){}}
function speak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.85;u.pitch=1.15;const v=s.getVoices().find(v=>/pt[-_]BR/i.test(v.lang));if(v)u.voice=v;s.speak(u)}catch(e){}}
function party(){const p=$('#party');p.innerHTML='';for(let i=0;i<40;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'vw';c.style.background=COLORS[i%12];c.style.animationDelay=Math.random()*.5+'s';p.appendChild(c)}[660,880,1100].forEach((f,i)=>setTimeout(()=>pop(f),i*120));setTimeout(()=>p.innerHTML='',2400)}
let askCb=null;
function ask(text,cb){$('#dlgT').textContent=text;askCb=cb;$('#veil').classList.add('on')}
$('#no').onclick=()=>$('#veil').classList.remove('on');
$('#yes').onclick=()=>{$('#veil').classList.remove('on');askCb&&askCb()};
function palette(el,onPick,startIdx){el.innerHTML=COLORS.map((c,i)=>`<button class="sw${i===startIdx?' on':''}" style="background:${c}" data-i="${i}" aria-label="Cor ${i+1}"></button>`).join('');
 el.addEventListener('click',e=>{const b=e.target.closest('.sw');if(!b)return;el.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===b));onPick(COLORS[+b.dataset.i]);pop(600+ +b.dataset.i*30)})}
const evs=e=>e.getCoalescedEvents?e.getCoalescedEvents():[e];

/* ---------- desenhos para colorir (cada .r é uma área que pinta) ---------- */
const SW=w=>`stroke="#2E2440" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;const S=SW(5);

const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1;
let strokes=store.get('thur-desenho',[]),cur=null,tool={c:COLORS[7],s:0.025,e:false};
palette($('#palD'),c=>{tool.c=c;tool.e=false;$('#eraser').classList.remove('on')},7);
function fit(){const r=cv.parentElement.getBoundingClientRect();if(!r.width)return;dpr=Math.min(window.devicePixelRatio||1,2.5);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}
function line(st,from){const m=Math.min(W,H);ctx.strokeStyle=st.e?'#fff':st.c;ctx.lineWidth=st.s*m;ctx.lineCap='round';ctx.lineJoin='round';const p=st.p;
 if(p.length===1){ctx.beginPath();ctx.fillStyle=ctx.strokeStyle;ctx.arc(p[0][0]*W,p[0][1]*H,st.s*m/2,0,7);ctx.fill();return}
 ctx.beginPath();const a=Math.max(0,from-1);ctx.moveTo(p[a][0]*W,p[a][1]*H);for(let i=a+1;i<p.length;i++)ctx.lineTo(p[i][0]*W,p[i][1]*H);ctx.stroke()}
function redraw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);strokes.forEach(s=>line(s,0))}
const ptOf=(el,e)=>{const r=el.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur={c:tool.c,s:tool.s,e:tool.e,p:[ptOf(cv,e)]};strokes.push(cur);line(cur,0)});
cv.addEventListener('pointermove',e=>{if(!cur)return;const n=cur.p.length;evs(e).forEach(ev=>cur.p.push(ptOf(cv,ev)));line(cur,n)});
const end=()=>{if(cur){cur.p=cur.p.map(([x,y])=>[+x.toFixed(4),+y.toFixed(4)]);cur=null;if(strokes.length>400)strokes=strokes.slice(-400);store.set('thur-desenho',strokes)}};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
$('#undo').onclick=()=>{strokes.pop();redraw();store.set('thur-desenho',strokes);pop(330)};
$('#clear').onclick=()=>ask('Apagar o desenho todo?',()=>{strokes=[];redraw();store.set('thur-desenho',strokes)});

$('#eraser').onclick=()=>{tool.e=!tool.e;$('#eraser').classList.toggle('on',tool.e);pop(380)};

const toSvg=(s,e)=>{const p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse())};

 if(pMode==='tap'){if(a.getAttribute('fill')===pColor)return;snap();a.setAttribute('fill',pColor);saveP();pop(700);return}
 snap();const id='c'+(++clipN)+Date.now().toString(36);const cp=document.createElementNS(NS,'clipPath');cp.id=id;const sh=a.cloneNode();sh.removeAttribute('class');cp.appendChild(sh);s.querySelector('defs').appendChild(cp);

 const path=document.createElementNS(NS,'path');const q=toSvg(s,e);const d=`M${q.x.toFixed(1)} ${q.y.toFixed(1)} l0.1 0`;path.setAttribute('d',d);

 const r=tcv.parentElement.getBoundingClientRect();if(!r.width)return;const d=Math.min(window.devicePixelRatio||1,2.5);tW=r.width;tH=r.height;tcv.width=tW*d;tcv.height=tH*d;tctx.setTransform(d,0,0,d,0,0);

 for(const c of[mk,um]){c.width=Math.ceil(tW*K);c.height=Math.ceil(tH*K)}const m=mk.getContext('2d');m.font=glyphFont(tFs*K);m.textAlign='center';m.textBaseline='middle';m.fillStyle='#000';m.fillText(ch,mk.width/2,y*K)}
function tLine(c,p,from,w,k){c.lineCap='round';c.lineJoin='round';c.lineWidth=w*k;c.beginPath();const a=Math.max(0,from-1);c.moveTo(p[a][0]*k,p[a][1]*k);if(p.length===1)c.lineTo(p[0][0]*k+.1,p[0][1]*k);for(let i=a+1;i<p.length;i++)c.lineTo(p[i][0]*k,p[i][1]*k);c.stroke()}
const tPt=e=>{const r=tcv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
function tDraw(from){const w=tFs*0.12;tctx.strokeStyle=lColor;tLine(tctx,tStroke,from,w,1);const u=um.getContext('2d');u.strokeStyle='#000';tLine(u,tStroke,from,w,K)}
tcv.addEventListener('pointerdown',e=>{e.preventDefault();tcv.setPointerCapture(e.pointerId);tStroke=[tPt(e)];tDraw(0)});
tcv.addEventListener('pointermove',e=>{if(!tStroke)return;const n=tStroke.length;evs(e).forEach(ev=>tStroke.push(tPt(ev)));tDraw(n)});
const tEnd=()=>{if(!tStroke)return;tStroke=null;check()};
tcv.addEventListener('pointerup',tEnd);tcv.addEventListener('pointercancel',tEnd);
function check(){if(lDone||!mk.width)return;const a=mk.getContext('2d').getImageData(0,0,mk.width,mk.height).data,b=um.getContext('2d').getImageData(0,0,um.width,um.height).data;
 let L=0,both=0,U=0;for(let i=3;i<a.length;i+=4){const l=a[i]>100,u=b[i]>100;if(l)L++;if(u)U++;if(l&&u)both++}
 if(L&&both/L>0.55&&both/U>0.33){lDone=true;$('#lStars').innerHTML='<svg viewBox="0 0 100 100" width="55%" height="55%" aria-hidden="true"><polygon points="50,8 61,38 93,38 67,57 77,89 50,70 23,89 33,57 7,38 39,38" fill="#FFD60A" stroke="#2E2440" stroke-width="3" stroke-linejoin="round" opacity=".9"/></svg>';party();const it=lItems()[lIdx];speak('Muito bem! '+(lSet==='num'?it[1]:it[0].toUpperCase()+' de '+it[1]))}}
function sayLetter(){const it=lItems()[lIdx];speak(lSet==='num'?it[1]:it[0].toUpperCase()+', de '+it[1])}
$('#lNext').onclick=()=>{pop(520);setLetter(lIdx+1);sayLetter()};$('#lPrev').onclick=()=>{pop(520);setLetter(lIdx-1);sayLetter()};
$('#lClear').onclick=()=>{pop(330);setLetter(lIdx)};
$('#lSay').onclick=sayLetter;
$$('.lset').forEach(b=>b.onclick=()=>{lSet=b.dataset.set;$$('.lset').forEach(x=>x.classList.toggle('on',x===b));pop(480);setLetter(0);sayLetter()});
new ResizeObserver(()=>{if($('#letras').classList.contains('on')&&!tStroke)setLetter(lIdx)}).observe(tcv.parentElement);

/* ---------- palavras: montar com as letras ---------- */
const PALAVRAS=[['SOL','☀️'],['LUA','🌙'],['UVA','🍇'],['OVO','🥚'],['PATO','🦆'],['GATO','🐱'],['BOLA','⚽'],['CASA','🏠'],['BOLO','🎂'],['SAPO','🐸'],['VACA','🐄'],['DADO','🎲'],['FLOR','🌸'],['PEIXE','🐟'],['MALA','🧳'],['PIPOCA','🍿']];
let wQueue=[],wHint=store.get('thur-dica',true),slots=[];
$('#wHint').classList.toggle('on',wHint);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newWord(){if(!wQueue.length)wQueue=shuffle(PALAVRAS.slice());word=wQueue.pop();slots=Array(word[0].length).fill(null);
 const letters=word[0].split('').map((c,i)=>({c,i}));let n=0;do{shuffle(letters);n++}while(letters.map(l=>l.c).join('')===word[0]&&n<20);
 $('#wPic').textContent=word[1];$('#tiles').innerHTML=letters.map(l=>`<button class="tile" data-t="${l.i}" aria-label="Letra ${l.c}">${l.c}</button>`).join('');renderSlots();setTimeout(()=>speak(word[0].toLowerCase()),250)}
function renderSlots(){$('#slots').innerHTML=slots.map((t,i)=>{const c=t===null?(wHint?word[0][i]:''):word[0][t];return`<button class="slot${t!==null?' full':''}" data-s="${i}" aria-label="Espaço ${i+1}">${c}</button>`}).join('')}
$('#tiles').addEventListener('click',e=>{const b=e.target.closest('.tile');if(!b||b.classList.contains('used'))return;const k=slots.indexOf(null);if(k<0)return;
 const t=+b.dataset.t;slots[k]=t;b.classList.add('used');speak(word[0][t].toLowerCase());pop(640);renderSlots();if(!slots.includes(null))wCheck()});
$('#slots').addEventListener('click',e=>{const s=e.target.closest('.slot');if(!s)return;const i=+s.dataset.s,t=slots[i];if(t===null)return;slots[i]=null;$(`.tile[data-t="${t}"]`).classList.remove('used');pop(380);renderSlots()});
function wCheck(){const got=slots.map(t=>word[0][t]).join('');if(got===word[0]){$$('.slot').forEach(s=>s.classList.add('ok'));party();speak(word[0].toLowerCase()+'! Muito bem!');setTimeout(newWord,2600)}
 else{const box=$('#slots');box.classList.add('shake');pop(200);setTimeout(()=>{box.classList.remove('shake');slots.forEach((t,i)=>{if(t!==null&&word[0][t]!==word[0][i]){$(`.tile[data-t="${t}"]`).classList.remove('used');slots[i]=null}});renderSlots()},450)}}
$('#wSay').onclick=()=>{if(word)speak(word[0].toLowerCase())};
$('#wNext').onclick=()=>{pop(520);newWord()};
$('#wHint').onclick=()=>{wHint=!wHint;store.set('thur-dica',wHint);$('#wHint').classList.toggle('on',wHint);renderSlots();pop(480)};

/* ---------- início ---------- */
{const h=location.hash.slice(1);show(h==='pintar'?'colorir':(h||'home'))}
try{speechSynthesis.getVoices()}catch(e){}
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
